[tool.poetry]
name = "varsome_api"
version = "1.0.0b0"
description = "A basic python api client implementation for https://api.varsome.com"
authors = ["Saphetor S.A. <support@saphetor.com>"]
readme = "README.md"
license = "Apache License, Version 2.0"
classifiers=[
        "Development Status :: 4 - Beta",
        "Intended Audience :: Developers",
        "Intended Audience :: Science/Research",
        "Operating System :: OS Independent",
        "License :: OSI Approved :: Apache License",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Topic :: Scientific/Engineering :: Bio-Informatics",
    ]
repository = "https://github.com/saphetor/varsome-api-client-python"

[tool.poetry.scripts]
varsome_api_run = "varsome_api.cli.varsome_api_run:main"
varsome_api_annotate_vcf = "varsome_api.cli.varsome_api_annotate_vcf:main"

[tool.poetry.dependencies]
python = ">=3.11, <3.15"
aiohttp = {version = "^3.13", extras = ["speedups"]}
pydantic = "^2.0"
pysam = {version = "^0.23", optional = true}

[tool.poetry.extras]
vcf = ["pysam"]

[tool.poetry.dev-dependencies]
black = "^26.3.0"
pysam = "^0.23"
isort = "^8.0.0"
flake8 = "^7.3.0"
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
coverage = "^7.6.1"
requests-mock = "^1.12"
pre-commit = "^4.5.0"
commitizen = "^4.13.0"
cz-github-jira-conventional = "^3.0.0"
datamodel-code-generator = {version = ">=0.55", extras = ["http"]}
pyyaml = "^6.0"
pytest-asyncio = "^1.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
branch = true
source = ["varsome_api"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
minversion = "9.0"
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=varsome_api",
    "--cov-report=term-missing:skip-covered"
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"

[tool.flake8]
ignore = ['E231', 'E241']
max-line-length = 88
count = true

[tool.pylint.format]
max-line-length = "88"
